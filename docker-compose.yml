services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${DB_NAME:-circuit_court}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-circuit_court}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      args:
        APP_VERSION: ${APP_VERSION:-v0.1.0}
        GIT_COMMIT: ${GIT_COMMIT:-local}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
      DB_NAME: ${DB_NAME:-circuit_court}
      APP_ENV: ${APP_ENV:-local}
      APP_VERSION: ${APP_VERSION:-v0.1.0}
      GIT_COMMIT: ${GIT_COMMIT:-local}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data: