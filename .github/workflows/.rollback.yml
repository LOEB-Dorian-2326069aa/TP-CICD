name: Rollback N-1

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: "Tag N-1 sur ghcr.io"
        required: true
        type: string
      reason:
        description: "Motif"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Redéployer N-1 & vérifier /health
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.previous_tag }}"
          echo "Rollback (${{ inputs.reason }}) -> $IMG"
          docker pull "$IMG"

          docker network create app_net || true
          docker run -d --name sim_db --network app_net -e POSTGRES_USER=app_user -e POSTGRES_PASSWORD=sim_password -e POSTGRES_DB=producteurs_db -v "$(pwd)/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" postgres:16-alpine
          for i in $(seq 1 30); do docker exec sim_db pg_isready -U app_user -d producteurs_db >/dev/null 2>&1 && break; sleep 1; done

          docker rm -f sim_api 2>/dev/null || true
          docker run -d --name sim_api --network app_net -p 3000:3000 -e DB_HOST=sim_db -e DB_PORT=5432 -e DB_USER=app_user -e DB_PASSWORD=sim_password -e DB_NAME=producteurs_db -e APP_VERSION="${{ inputs.previous_tag }}" "$IMG"

          for i in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health || true)" = "200" ] && exit 0
            sleep 2
          done
          docker logs sim_api || true
          exit 1
      - if: always()
        run: docker rm -f sim_api sim_db 2>/dev/null || true; docker network rm app_net 2>/dev/null || true